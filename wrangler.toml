name               = "agri-nile-flow"
main               = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding       = "DB"
database_name = "agri-nile-flow-data-lake"
database_id   = "2dd5cfe6-b694-46bd-9cb8-adf1bc7c27af"

[vars]
APP_ENV    = "production"
# Dead env var — not consumed by any source code. Retained for reference only.
# Runtime toggle for GL posting engine: UPDATE gl_integration_settings SET is_enabled=1 WHERE module_key='posting_engine';
ENABLE_POSTING_ENGINE = "true"

# ── Cron Triggers ─────────────────────────────────────────────
# تشتغل كل يوم الساعة 10 مساءً UTC (منتصف الليل بتوقيت القاهرة)
[triggers]
crons = ["0 22 * * *"]

# R2 deferred — not activated yet
# [[r2_buckets]]
# binding     = "DOCS_BUCKET"
# bucket_name = "agri-nile-docs"

[dev]
port           = 8787
local_protocol = "http"
